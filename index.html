<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Водоворот · Атлас галактик</title>
    <meta name="description" content="Интерактивная 3D-модель галактики Водоворот (M51, NGC 5194): вращайте, приближайте и смотрите на неё в разных диапазонах света." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2304050a'/%3E%3Cpath d='M16 16c0-4 5-5 7-2s0 9-7 9-10-6-8-12 10-7 14-3' fill='none' stroke='%23e8e2d4' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f0577a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,300;1,400;1,500&family=Golos+Text:wght@400;500;600&family=PT+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-band="visible">
    <canvas id="sky" aria-label="Трёхмерная модель галактики Водоворот. Перетаскивайте, чтобы вращать, прокручивайте, чтобы приблизить."></canvas>
    <div id="labels" class="labels"></div>

    <header class="masthead">
      <p class="brand"><span class="brand__dot" aria-hidden="true"></span>Атлас галактик</p>
      <p class="eyebrow" id="catalog"></p>
      <h1 class="title" id="galaxy-name"></h1>
      <p class="lede" id="lede"></p>
    </header>

    <button class="dossier-toggle" id="dossier-toggle" type="button" aria-expanded="false" aria-controls="dossier">
      Досье
    </button>

    <aside class="dossier" id="dossier" aria-label="Досье галактики" aria-hidden="true">
      <div class="dossier__head">
        <p class="eyebrow">Досье</p>
        <button class="icon-btn" id="dossier-close" type="button" aria-label="Закрыть досье">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" /></svg>
        </button>
      </div>
      <div class="dossier__body" id="dossier-body"></div>
    </aside>

    <section class="filter" aria-label="Диапазон света">
      <div class="filter__caption" aria-live="polite">
        <p class="eyebrow" id="band-range"></p>
        <p class="filter__title" id="band-title"></p>
        <p class="filter__instrument" id="band-instrument"></p>
        <p class="filter__text" id="band-text"></p>
      </div>
      <div class="wheel" id="wheel" role="radiogroup" aria-label="Фильтр"></div>
    </section>

    <div class="hud">
      <div class="scale" aria-hidden="true">
        <div class="scale__bar" id="scale-bar"></div>
        <span class="scale__label" id="scale-label"></span>
        <span class="readout" id="readout"></span>
      </div>
      <div class="controls">
        <p class="hint" id="hint"></p>
        <nav class="views" id="views" aria-label="Ракурс"></nav>
        <div class="toggles">
          <button class="chip" type="button" id="toggle-structure" aria-pressed="true">Строение</button>
          <button class="chip" type="button" id="toggle-events" aria-pressed="true">Вспышки</button>
          <button class="chip" type="button" id="toggle-rotate" aria-pressed="false">Вращение</button>
        </div>
      </div>
    </div>

    <div class="loader" id="loader" role="status">
      <p class="loader__text">Собираем звёзды Водоворота</p>
      <div class="loader__line"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
